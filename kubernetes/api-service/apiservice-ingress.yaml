# Ingress api-service menggunakan Traefik (ingressClass bawaan k3s).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apiservice-ingress
  namespace: microservice-app
  labels:
    app: apiservice
  annotations:
    # Entry point HTTPS (websecure). Sertifikat diambil dari Secret di bawah.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - aitoken.com
      secretName: apiservice-secret
  rules:
    - host: aitoken.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apiservice-service
                port:
                  number: 4000
