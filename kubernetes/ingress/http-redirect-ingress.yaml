# Ingress untuk port 80: tidak menyajikan konten, hanya redirect ke HTTPS.
apiVersion: networking.k8s.io/v1 
kind: Ingress 
metadata:
  name: http-redirect-ingress 
  namespace: microservice-app 
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web 
    traefik.ingress.kubernetes.io/router.middlewares: microservice-app-https-redirect@kubernetescrd 
    traefik.ingress.kubernetes.io/router.priority: "200" 
spec:
  ingressClassName: traefik 
  rules:
    - host: tokenaiku.my.id 
      http:
        paths:
          - path: / 
            pathType: Prefix 
            backend:
              service:
                name: frontend-service 
                port:
                  number: 80 
