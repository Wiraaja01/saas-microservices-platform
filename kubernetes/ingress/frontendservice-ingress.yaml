apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontendservice-ingress 
  namespace: microservice-app 
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik 
  tls:
    - hosts:
        - tokenaiku.my.id # host yang sudah di beli di sumopod hehe
      secretName: apiservice-secret 
  rules:
    - host: tokenaiku.my.id
      http:
        paths:
          - path: / 
            pathType: Prefix 
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
