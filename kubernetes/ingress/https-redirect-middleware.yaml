# Middleware Traefik: mengalihkan request HTTP (port 80) ke HTTPS (port 443).
apiVersion: traefik.io/v1alpha1 # versi CRD Middleware dari Traefik v3 bawaan k3s
kind: Middleware # jenis resource Traefik, bukan Ingress
metadata:
  name: https-redirect # nama yang dipakai di annotation Ingress
  namespace: microservice-app # namespace harus sama dengan Ingress
spec:
  redirectScheme: # aturan redirect scheme
    scheme: https # tujuan skema: https
    permanent: true # pakai 301 (permanent), bukan 302
