# Redis untuk cache API dan rate limit gateway.
# Tidak memakai persistent storage: data hilang saat pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: microservice-app
  labels:
    app: redis
spec:
  replicas: 1
  # Recreate supaya saat rollout tidak ada 2 pod Redis sekaligus
  # (hemat memory di VM 2GB).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          # key lama (LRU) sebelum container kena OOMKill.
          args:
            - redis-server
            - --maxmemory
            - "40mb"
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
