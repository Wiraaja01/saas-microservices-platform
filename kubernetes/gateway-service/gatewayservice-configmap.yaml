apiVersion: v1
kind: ConfigMap
metadata:
  name: gatewayservice-config
  namespace: microservice-app
spec:
  data:
    PORT: "5000"
    NODE_ENV: "production"
    REDIS_URL: "redis://redis-service:6379"
    RATE_LIMIT_MAX: "100"
    RATE_LIMIT_WINDOW: "60"
#karena limit dari instance, RabbitMQ dibuat dummy dulu
    RABBITMQ_URL: "amqp://guest:guest@localhost:5672"
