apiVersion: v1
kind: ConfigMap
metadata:
  name: gatewayservice-config
  namespace: microservice-app
data:
  PORT: "5000"
  NODE_ENV: "production"
  REDIS_URL: "redis://redis-service:6379"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "60"
  # RabbitMQ berjalan di namespace yang sama; pakai Service DNS, bukan localhost.
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672"
