apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: cloudflared 
  namespace: cloudflare-tunnel 
spec:
  # Replica set 1 jikalau ingin menggunakan Cloudflare Tunnel
  replicas: 0
  selector:
    matchLabels:
      app: cloudflared 
  template:
    metadata:
      labels:
        app: cloudflared 
    spec:
      containers:
        - name: cloudflared 
          image: cloudflare/cloudflared:latest 
          imagePullPolicy: IfNotPresent 
          command: 
            - cloudflared 
            - tunnel 
            - --no-autoupdate 
            - --loglevel 
            - info 
            - --metrics 
            - 0.0.0.0:2000 
            - run 
          env:
            - name: TUNNEL_TOKEN # cloudflared membaca otomatis env ini
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token # key di dalam Secret
          ports:
            - name: metrics 
              containerPort: 2000 
          resources:
            requests:
              cpu: "10m" 
              memory: "32Mi" 
            limits:
              cpu: "100m" # batas CPU
              memory: "128Mi" # batas memory supaya node 2GB aman
          readinessProbe: 
            httpGet:
              path: /ready 
              port: metrics 
            initialDelaySeconds: 5 
            periodSeconds: 10 
          livenessProbe: 
            httpGet:
              path: /ready 
              port: metrics 
            initialDelaySeconds: 15 
            periodSeconds: 15 
            failureThreshold: 3 
