# ConfigMap untuk worker-service.
# Worker adalah queue consumer RabbitMQ dan TIDAK membuka port HTTP,
# jadi tidak ada PORT di sini dan tidak ada Service/Ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workerservice-config
  namespace: microservice-app
data:
  NODE_ENV: "production"
  # Dibaca di src/config/rabbitmq.js (channel.prefetch)
  WORKER_CONCURRENCY: "10"
  # RabbitMQ masih dinonaktifkan (kubernetes/_disabled/) karena RAM node 2 GB.
  # Kalau worker di-scale > 0 sebelum broker hidup, worker tidak crash:
  # ia akan retry koneksi tiap 5 detik sampai RabbitMQ tersedia.
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672"
