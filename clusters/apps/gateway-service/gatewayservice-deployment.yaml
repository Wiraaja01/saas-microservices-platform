apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayservice-deployment
  namespace: microservice-app
  labels:
    app: gatewayservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatewayservice
  template:
    metadata:
      labels:
        app: gatewayservice
    spec:
      containers:
        - name: gatewayservice
          image: wiraaja1/microservice-on-kube-with-cicd-gateway-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"           
          envFrom:
            - configMapRef:
                name: gatewayservice-config
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: RABBITMQ_DEFAULT_PASS
              