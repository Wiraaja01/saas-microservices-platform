# Deployment frontend
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: frontend-deployment 
  namespace: microservice-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend 
  template:
    metadata:
      labels:
        app: frontend 
    spec:
      containers:
        - name: frontend 
          image: wiraaja1/microservice-on-kube-with-cicd-frontend:latest
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 80 
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m" 
              memory: "64Mi" 
          volumeMounts:
            - name: nginx-conf 
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf 
          configMap:
            name: frontend-nginx-config # ConfigMap berisi nginx.conf yang benar
