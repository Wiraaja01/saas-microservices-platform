name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api-service/**"
      - ".github/workflows/ci-api-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api-service/**"
      - ".github/workflows/ci-api-service.yml"
permissions:
  contents: read

# -----------------------------------------------------------------------------
# Kalau ada 2 push beruntun, batalkan yang lama dan jalankan yang terbaru.
# Hemat waktu & tidak rebutan saat deploy.
# -----------------------------------------------------------------------------
concurrency:
  group: ci-api-service-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# VARIABEL GLOBAL (bisa dipakai di semua job lewat ${{ env.NAMA }})
# Catatan penting: `env` TIDAK bisa dipakai di dalam `with:`, jadi untuk
# `with:` nilainya ditulis langsung (literal) di bawah.
# -----------------------------------------------------------------------------
env:
  # Nama image di Docker Hub: <username>/<nama-image>
  # Sudah disamakan dengan yang dipakai kubernetes/api-service/apiservice-deployment.yaml
  # TODO: ganti "wiraaja1" kalau kamu pakai akun Docker Hub lain.
  IMAGE_NAME: wiraaja1/microservice-on-kube-with-cicd-api-service

  # Folder aplikasi. Dipakai di `working-directory:` dan `run:`.
  APP_PATH: apps/api-service

jobs:
  # ===========================================================================
  # JOB 1 — CI (Continuous Integration): test → build → push image
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest        # mesin virtual gratis milik GitHub

    steps:
      # -----------------------------------------------------------------------
      # [1] CHECKOUT CODE
      # Mengambil isi repo ke mesin runner. Tanpa step ini, folder kerja
      # masih kosong dan semua step berikutnya akan gagal.
      # -----------------------------------------------------------------------
      - name: "1. Checkout code"
        uses: actions/checkout@v4
        # with:
        #   fetch-depth: 0     # TODO (opsional): ambil seluruh histori git,
        #                      # perlu kalau butuh `git describe`/versioning.

      # -----------------------------------------------------------------------
      # [2] SETUP NODE.JS
      # Memasang Node.js di runner, plus cache folder npm supaya `npm ci`
      # berikutnya tidak download ulang dari internet (lebih cepat).
      # -----------------------------------------------------------------------
      - name: "2. Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"          # TODO: samakan dengan Dockerfile (node:22-alpine)
          cache: npm
          cache-dependency-path: apps/api-service/package-lock.json

      # 2b. Install dependency.
      #     `npm ci` (bukan `npm install`) = instalasi bersih, persis mengikuti
      #     package-lock.json. Ini yang benar untuk CI supaya hasilnya konsisten.
      - name: "2b. Install dependencies"
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      # 2c. Generate Prisma Client.
      #     Wajib, karena kode memakai @prisma/client yang dibangun dari
      #     apps/api-service/prisma/schema.prisma.
      - name: "2c. Prisma generate"
        working-directory: ${{ env.APP_PATH }}
        run: npx prisma generate

      # -----------------------------------------------------------------------
      # [3] AUTOMATED TESTING
      # Menjalankan test otomatis. Kalau ada yang GAGAL, step ini merah dan
      # step 4-6 (login, build, push, deploy) TIDAK dijalankan.
      # Inilah "gerbang" supaya kode rusak tidak sampai ke server.
      # -----------------------------------------------------------------------
      - name: "3. Automated testing"
        working-directory: ${{ env.APP_PATH }}
        run: npm test -- --ci --coverage
        # TODO: sesuaikan kalau nanti pindah dari Jest.
        #
        # Script "test" di package.json adalah "jest".
        # Test ada di apps/api-service/test/ (5 suite, 47 test) dan TIDAK
        # menyentuh PostgreSQL/Redis — keduanya di-mock per file test.
        # Jadi tidak perlu service container untuk menjalankan step ini.
        #
        # Kalau nanti menambah test yang butuh database sungguhan, buka
        # DATABASE_URL di bawah dan tambahkan `services: postgres` di job ini.
        env:
          NODE_ENV: test
          # Nilai dummy khusus test. JANGAN pakai secret production di sini.
          JWT_SECRET: test-secret
          # TODO: buka kalau test butuh database (misal pakai service container).
          # DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # (opsional) Simpan laporan coverage sebagai artifact, bisa di-download
      # dari halaman run di GitHub. `if: always()` = tetap jalan walau test gagal.
      - name: "3b. Upload coverage report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-service
          path: apps/api-service/coverage/
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # [4] DOCKER LOGIN
      # Login ke Docker Hub supaya runner diizinkan push image.
      # Pakai Access Token (bukan password akun): bisa dicabut kapan saja
      # tanpa mengubah password, dan bisa dibatasi hanya untuk read/write.
      # -----------------------------------------------------------------------
      - name: "4. Docker login"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # registry: docker.io      # default Docker Hub, tidak perlu diubah
          #                          # ganti ke ghcr.io kalau pakai GitHub Packages

      # -----------------------------------------------------------------------
      # [5] BUILD & PUSH IMAGE
      # Build dari apps/api-service/Dockerfile, lalu push ke registry.
      # Dua tag sengaja dibuat:
      #   - ${{ github.sha }} : unik per commit → aman untuk rollback
      #                         (kamu tahu persis image mana isi commit mana)
      #   - latest            : selalu menunjuk build terbaru
      # -----------------------------------------------------------------------
      - name: "5a. Build image"
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            -f ${{ env.APP_PATH }}/Dockerfile \
            ${{ env.APP_PATH }}
        # Penjelasan flag:
        #   -t            = tag/nama image
        #   -f            = lokasi Dockerfile
        #   argumen akhir = build context (folder yang dikirim ke Docker)

      - name: "5b. Push image"
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # (opsional tapi berguna) Simpan tag yang dipakai ke output job,
      # supaya job deploy memakai tag yang PERSIS SAMA, tidak menebak.
      - name: "5c. Simpan tag image"
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    # `outputs` = nilai yang bisa dibaca job lain lewat `needs.<job>.outputs.*`
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

  # ===========================================================================
  # JOB 2 — DEPLOYMENT
  # `needs` = tunggu Job 1 sukses dulu. Kalau CI gagal, deploy otomatis dilewati.
  # ===========================================================================
  deploy:
    name: Deploy to k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production       # TODO: buat Environment "production" di
    #                                Settings → Environments (opsional, tapi bagus
    #                                untuk menaruh approval manual sebelum deploy)

    # -------------------------------------------------------------------------
    # PENTING untuk project ini — baca sebelum dipakai:
    #
    # Cluster k3s kamu TIDAK punya public IP (lihat README: appserver ada di
    # private subnet, diakses lewat SSM). Runner GitHub jalan di internet,
    # jadi TIDAK bisa langsung `kubectl` ke API server.
    #
    # Pilihan pendekatan:
    #   A. Self-hosted runner di dalam VPC
    #      → ganti `runs-on: ubuntu-latest` jadi `runs-on: self-hosted`
    #      → kubeconfig-nya sudah ada di mesin itu, step 6b bisa dihapus
    #
    #   B. GitHub OIDC → AWS → `aws ssm send-command` (paling aman, tanpa
    #      kubeconfig dan tanpa membuka API server)
    #      → butuh: role IAM, permission ssm:SendCommand, instance ID appserver
    #
    #   C. Kubeconfig ke API server yang bisa dijangkau (tunnel/VPN)
    #      → ini yang dicontohkan di bawah
    #
    # Template di bawah memakai cara C. Silakan pilih sesuai kondisi kamu.
    # -------------------------------------------------------------------------
    steps:
      - name: "6a. Setup kubectl"
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"       # TODO: samakan dengan versi k3s kamu
          #                          cek dengan: kubectl version --short

      - name: "6b. Tulis kubeconfig"
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        # `base64 -d` = decode. Secret disimpan dalam bentuk base64 karena
        # kubeconfig itu multi-baris (YAML), dan secret GitHub lebih aman
        # untuk teks satu baris.

      - name: "6c. Cek koneksi cluster"
        run: kubectl cluster-info
        # Kalau step ini gagal → berarti runner memang tidak bisa menjangkau
        # cluster. Balik lagi ke pilihan A/B di komentar atas.

      - name: "6d. Update image di deployment"
        run: |
          kubectl set image deployment/apiservice-deployment \
            apiservice=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n microservice-app
        # `kubectl set image` = ganti image container tanpa edit YAML manual.
        # Formatnya: <nama-container>=<image>:<tag>
        #   deployment/apiservice-deployment  → dari kubernetes/api-service/
        #   apiservice                        → nama container di dalam pod
        #   microservice-app                  → namespace
        #
        # TODO: kalau mau lebih "GitOps", ganti step ini dengan meng-apply
        # file manifest (kubectl apply -f kubernetes/api-service/) yang tag-nya
        # sudah kamu update dulu.

      - name: "6e. Tunggu rollout selesai"
        run: |
          kubectl rollout status deployment/apiservice-deployment \
            -n microservice-app --timeout=120s
        # Menunggu sampai pod baru benar-benar siap (readiness probe lolos).
        # Kalau tidak siap dalam 120 detik → step gagal.

      - name: "6f. Rollback kalau deploy gagal"
        if: failure()
        run: |
          kubectl rollout undo deployment/apiservice-deployment -n microservice-app
        # `if: failure()` = hanya jalan kalau ada step sebelumnya yang gagal.
        # Jadi kalau image baru bermasalah, otomatis balik ke versi sebelumnya.
