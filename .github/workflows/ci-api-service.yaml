name: CI untuk API Service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api-service/**"
      - ".github/workflows/ci-api-service.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api-service/**"
      - ".github/workflows/ci-api-service.yaml"
#tambahkan permission untuk hanya read konten saja, ditambahkan by auth supaya tidak ada error "Resource not accessible by integration" saat checkout
permissions:
  contents: read
#concurrency = mencegah job yang sama berjalan bersamaan, misal kalau ada 2 push sekaligus
#cancel in progress = membatalkan job yang sedang berjalan kalau ada job baru yang sama
concurrency:
  group: ci-api-service-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE_NAME: wiraaja1/microservice-on-kube-with-cicd-api-service
  APP_PATH: apps/api-service

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout code"
        uses: actions/checkout@v4

      - name: "2. Configure Node.js"
        uses: actions/setup-node@v4
        with:
          # HARUS angka versi ("22"), bukan nama image Docker ("node:22-alpine").
          # setup-node mengunduh Node dari nodejs.org, bukan dari Docker Hub.
          # Samakan dengan Dockerfile: FROM node:22-alpine.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api-service/package-lock.json

      - name: "2b. Install dependencies"
        working-directory: ${{ env.APP_PATH }}
        run: npm ci

      - name: "2c. Prisma generate"
        working-directory: ${{ env.APP_PATH }}
        run: npx prisma generate

      - name: "3. Automated testing"
        working-directory: ${{ env.APP_PATH }}
        # `npm ci` sudah dijalankan di step 2b, jadi tidak perlu `npm install` lagi.
        # --ci = jangan bikin snapshot baru; --coverage = laporan untuk artifact.
        run: npm test -- --ci --coverage
        env:
          NODE_ENV: test
          # Nilai dummy. Test me-mock Prisma & Redis, jadi TIDAK ada koneksi
          # database sungguhan. Jangan pakai secret production di sini.
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          JWT_SECRET: test-secret
          JWT_EXPIRES_IN: 1h

      - name: "4. Docker login"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: "5a. Build image"
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_PATH }}
          # Eksplisit: pakai apps/api-service/Dockerfile (node 22),
          # BUKAN apps/api-service/src/Dockerfile (node 18, file lama).
          file: ${{ env.APP_PATH }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: "5b. Simpan tag image"
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}