name: CI untuk API Service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api-service/**"
      - ".github/workflows/ci-api-service.yaml"
      - ".github/workflows/ci-template.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api-service/**"
      - ".github/workflows/ci-api-service.yaml"
      - ".github/workflows/ci-template.yaml"

permissions:
  contents: read

concurrency:
  group: ci-api-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI API Service
    uses: ./.github/workflows/ci-template.yaml
    with:
      app_path: apps/api-service
      image_name: wiraaja1/microservice-on-kube-with-cicd-api-service
      run_prisma: true
      run_tests: true
      run_sonar: true
      run_trivy: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_APISERVICE }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
