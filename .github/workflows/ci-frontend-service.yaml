name: CI untuk Frontend Service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ci-frontend-service.yaml"
      - ".github/workflows/ci-template.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ci-frontend-service.yaml"
      - ".github/workflows/ci-template.yaml"

permissions:
  contents: read

concurrency:
  group: ci-frontend-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Frontend Service
    uses: ./.github/workflows/ci-template.yaml
    with:
      app_path: apps/frontend
      image_name: wiraaja1/microservice-on-kube-with-cicd-frontend
      install_command: npm ci --legacy-peer-deps
      run_build: true
      run_sonar: true
      run_trivy: false
      push_image: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
