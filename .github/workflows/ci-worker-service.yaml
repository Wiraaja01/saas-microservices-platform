name: CI untuk Worker Service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker-service/**"
      - ".github/workflows/ci-worker-service.yaml"
      - ".github/workflows/ci-template.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/worker-service/**"
      - ".github/workflows/ci-worker-service.yaml"
      - ".github/workflows/ci-template.yaml"

permissions:
  contents: read

concurrency:
  group: ci-worker-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Worker Service
    uses: ./.github/workflows/ci-template.yaml
    with:
      app_path: apps/worker-service
      image_name: wiraaja1/microservice-on-kube-with-cicd-worker-service
      run_build: true
      run_syntax_check: true
      run_sonar: true
      run_trivy: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WORKER }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
