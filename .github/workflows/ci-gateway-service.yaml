name: CI untuk Gateway Service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/gateway-service/**"
      - ".github/workflows/ci-gateway-service.yaml"
      - ".github/workflows/ci-template.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/gateway-service/**"
      - ".github/workflows/ci-gateway-service.yaml"
      - ".github/workflows/ci-template.yaml"

permissions:
  contents: read

concurrency:
  group: ci-gateway-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Gateway Service
    uses: ./.github/workflows/ci-template.yaml
    with:
      app_path: apps/gateway-service
      image_name: wiraaja1/microservice-on-kube-with-cicd-gateway-service
      run_tests: true
      run_sonar: true
      run_trivy: true
      push_image: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_GATEWAY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
